<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Ultron</title>
  <style>
    body { font: 13px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 16px; width: 300px; background: #0b1220; color: #dbeafe; }
    h1 { font-size: 15px; letter-spacing: .14em; margin: 0 0 10px; color: #fff; }
    label { display: block; margin: 10px 0 4px; color: #a5f3fc; font-size: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid #1e3a5f; background: #0f1b30; color: #fff; font: 600 14px ui-monospace, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    button { margin-top: 10px; padding: 7px 14px; border-radius: 6px; border: 1px solid #22d3ee; background: transparent; color: #a5f3fc; cursor: pointer; }
    button:hover { background: rgba(34, 211, 238, .15); }
    .status { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: #111c33; }
    .ok { color: #4ade80; } .bad { color: #fb923c; }
    .hint { color: #94a3b8; font-size: 11.5px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>ULTRON</h1>
  <label for="code">Eşleştirme kodu</label>
  <input id="code" maxlength="16" autocomplete="off" spellcheck="false" placeholder="ör. 3FA91C0B" />
  <button id="save">Kaydet ve bağlan</button>
  <div class="status" id="status">Durum okunuyor…</div>
  <p class="hint">Kodu Ultron'a "Chrome eklentisi kodu ne?" diye sorarak öğrenebilirsin. Eklenti sadece bu bilgisayardaki Ultron'la konuşur.</p>
  <script src="options.js"></script>
</body>
</html>
